name: 脱敏需求咨询
description: 提交不含敏感信息的知识资料或自动化需求摘要
title: "[需求咨询] "
labels: ["service-inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        表单版本：1.3.0。

        本渠道由账户持有人授权的 AI 助理监测。请勿提交密码、密钥、账号、支付资料、客户名单、合同原文或其他敏感信息。

        提交公开需求不等于成交。合同、最终报价和收款由账户持有人本人确认。
  - type: checkboxes
    id: public_notice
    attributes:
      label: 公开渠道确认
      options:
        - label: 我理解 GitHub 公开 Issue 对互联网可见，不会在此提交敏感个人信息、商业秘密或未授权资料。
          required: true
        - label: 我理解本入口只用于脱敏需求摘要，不在此完成合同、付款或数据处理授权。
          required: true
  - type: dropdown
    id: service_direction
    attributes:
      label: 服务方向
      description: 知识库只是其中一项；也可以选择其他自动化需求。
      options:
        - 知识库与资料来源
        - 表格/PDF 数据清洗与对账
        - 报告/周报/资料监测
        - 单一流程 AI 自动化
        - 其他自动化需求
        - 尚未确定
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 业务场景
      description: 请用非敏感方式说明行业、角色和主要任务。
    validations:
      required: true
  - type: textarea
    id: documents
    attributes:
      label: 输入与输出
      description: 只说明类型和大致规模，例如 PDF 50 份、Excel 1,000 行、需要异常清单或周报。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 最耗时或最容易重复的三步
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: 是否要求本地处理
      options:
        - 必须本地处理
        - 可以脱敏后使用外部服务
        - 尚未确定
    validations:
      required: true
  - type: dropdown
    id: data_class
    attributes:
      label: 数据分类（只选类别，不要粘贴内容）
      options:
        - 完全公开
        - 合成或演示数据
        - 内部资料
        - 含客户/合同/报价等商业秘密
        - 含敏感个人信息或受监管数据
        - 尚不清楚
    validations:
      required: true
  - type: input
    id: outcome
    attributes:
      label: 希望 7 天内看到的验收结果
      placeholder: 例如：20 个问题中至少 16 个在前 5 条找到约定来源，引用覆盖率至少 95%
    validations:
      required: true
  - type: input
    id: acceptance_questions
    attributes:
      label: 可提供的验收问题数量
      placeholder: 例如：20；暂时没有可写“待定”
    validations:
      required: true
